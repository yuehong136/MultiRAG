# osv-scanner 豁免清单（CI lint job 使用，见 .github/workflows/ci.yml）
#
# 规则（与其他燃尽清单同文化，只出不进）：
# - 每条必须带 reason（约束方 + 复查条件）；解除约束后立即删除对应条目；
# - 新增豁免视为门禁变更受控，须单独说明理由；
# - 整包豁免（PackageOverrides）只用于"版本被结构性约束锁死、逐 ID 维护无信息量"的包，
#   其余一律按漏洞 ID 豁免（IgnoredVulns），保证同包新出现的可修告警仍然爆红。
#
# 快照：2026-07-09 分诊（osv-scanner v2.4.0 × uv.lock）。

# ============================================================
# 整包豁免：版本被依赖栈结构性锁死（复查条件 = 约束解除）
# ============================================================

[[PackageOverrides]]
name = "torch"
ecosystem = "PyPI"
ignore = true
reason = "2.6.0 锁定：升级归依赖现代化批次 3（transformers/torch 同批），多数告警为 torch.load 反序列化面且无统一修复版本；模型文件为自管资源非用户可控输入。复查：批次 3 启动时。"

[[PackageOverrides]]
name = "transformers"
ecosystem = "PyPI"
ignore = true
reason = "4.36.2 锁定：升级需 4.48+，模型加载行为面大需专项验证，归批次 3。复查：批次 3 启动时。"

[[PackageOverrides]]
name = "litellm"
ecosystem = "PyPI"
ignore = true
reason = "1.82.x 锁定（pyproject ~=1.82.0）：CVE 集中在 litellm proxy server 组件，我方仅用 SDK 路由不部署 proxy；升级与 provider 收编评估（批次 4）同期决策。复查：批次 4。"

[[PackageOverrides]]
name = "onnx"
ecosystem = "PyPI"
ignore = true
reason = "1.19.0 锁定：1.21 修复线被 fastembed<0.5 约束挡死，fastembed≥0.5 需 numpy≥2.1（graspologic pin <2）。复查：numpy≥2 迁移批次（批次 3 主轴）。"

[[PackageOverrides]]
name = "pillow"
ecosystem = "PyPI"
ignore = true
reason = "10.4.0 锁定：修复线在 12.x，被 fastembed<11 pin 挡死，与 onnx 同属 numpy≥2 解锁链。复查：numpy≥2 迁移批次。"

[[PackageOverrides]]
name = "pdfminer-six"
ecosystem = "PyPI"
ignore = true
reason = "20221105 锁定：pdfplumber==0.10.4 精确 pin（谨慎抢跑档，调用点在跟踪文件内）。复查：pdfplumber 升级时。"

# ============================================================
# 按 ID 豁免：单点约束（同包新告警仍会爆红）
# ============================================================

[[IgnoredVulns]]
id = "GHSA-hx9q-6w63-j58v"
reason = "orjson 修复线 3.11.5 被 mistralai==0.4.2 pin <3.11 挡死（别名 PYSEC-2026-107）；mistralai 属批次 3（随上游节奏）。复查：mistralai 升级时。"

[[IgnoredVulns]]
id = "GHSA-rgxp-2hwp-jwgg"
reason = "pyarrow 修复线 23.0.1 被 infinity-sdk pin <23 挡死（别名 PYSEC-2026-113）；CVSS 7.0。复查：infinity-sdk 放开 pin。"

[[IgnoredVulns]]
id = "GHSA-h35f-9h28-mq5c"
reason = "setuptools 修复线 83.0.0 被 infinity-sdk pin <81 挡死（别名 PYSEC-2026-3447/CVE-2026-59890，0.7.0 正式版仍未放开）；CVSS 6.1。复查：infinity-sdk 放开 pin。"

# cryptography 三条：修复线 49.0.0 / 50.0.0 全被 agentrun-sdk>=0.0.23 →
# alibabacloud-tea-openapi 的 cryptography>=3.0.0,<49.0.0 结构性挡死
# （`uv lock --upgrade-package cryptography` 直接报 unsatisfiable；pyproject 里
# 那个 <49.0.0 上界就是照这个上游天花板设的）。lock-only 小步升无路可走，
# 48.x 内没有任何修复版本。三条的受影响面我方均无调用点：全仓只用
# AESGCM（Channel 凭据加密）、AES-CBC + PKCS7 分组填充、PBKDF2HMAC，
# 没有任何 cryptography.x509 用法，也不碰 pkcs7_decrypt_*。
# 复查：agentrun-sdk / alibabacloud-tea-openapi 放开 cryptography 上界时；
# 届时若已有传递依赖开始使用 x509 verifier 或 PKCS#7 解密，须重新评估而非续期。

[[IgnoredVulns]]
id = "GHSA-jwv3-5hgf-82ww"
reason = "cryptography 修复线 49.0.0，被 agentrun-sdk → alibabacloud-tea-openapi 的 <49.0.0 挡死（别名 CVE-2026-69249）；severity high。受影响面是 cryptography.x509.verification 的证书链构建：重复自签中间证书触发指数级膨胀，属资源耗尽型 DoS，不影响校验正确性。我方无任何 cryptography.x509 调用点。复查：上游放开 cryptography 上界。"

[[IgnoredVulns]]
id = "GHSA-m2h6-j472-rp4c"
reason = "cryptography 修复线 49.0.0，同上被 <49.0.0 挡死（别名 CVE-2026-69248）；severity medium。受影响面是 x509 verifier 接受过宽通配符 SAN（叶证书 *.example.com 可逃出中间 CA 的 permittedSubtrees=foo.example.com 名称约束）。我方不做证书链校验，TLS 校验走 OpenSSL 而非本库的 Python verifier。复查：上游放开 cryptography 上界。"

[[IgnoredVulns]]
id = "GHSA-g6cj-pr64-35w5"
reason = "cryptography 修复线 50.0.0（Renovate PR #9 追的就是这条，因结构性不可达已关闭）；别名 CVE-2026-69247，severity high。受影响面是 pkcs7_decrypt_der/pem/smime 解密不可信 EnvelopedData 时暴露 Bleichenbacher 预言机，利用前提是 S/MIME 网关那类自动解密并高频回显结果的服务。我方不解密 PKCS#7 EnvelopedData——代码里的 PKCS7 只是 AES-CBC 的分组填充（common/crypto_utils.py、common/datav_persondata_crypto.py），是同名不同物。复查：上游放开 cryptography 上界。"

