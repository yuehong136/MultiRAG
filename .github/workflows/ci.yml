# MultiRAG CI —— 与本地 Makefile 对应的分层验证
#   lint      = make lint      (Tier 0)
#   security  = gitleaks + osv-scanner（版本无关，独立执行一次）
#   typecheck = make typecheck (Tier 1)
#   unit      = make coverage  (Tier 2)
#   core shards / consumers / Go / smoke are independent required jobs; quality is separate.
name: ci

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: python3 scripts/ci_checks.py scope

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # dev 工具组（ruff/import-linter/门禁脚本）已验证 3.13 可跑，两版本均必过；
    # 版本无关的锁文件一致性检查只在 3.12 跑一次省时避噪。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          # 与本地工具链、uv.lock 产出版本对齐（pyproject [tool.uv] required-version
          # 同区间）。CI 浮动装新版 uv 会让 `uv lock --check` 因锁格式重写而误报漂移。
          # 升级 uv 时本地、此文件各处 pin、重锁 uv.lock 三者必须同一提交内完成。
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --python ${{ matrix.python-version }} --only-group dev --frozen
      # 锁文件一致性：pyproject 改了但 uv.lock 未更新即失败
      - run: uv lock --check
        if: matrix.python-version == '3.12'
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check --output-format=github .
      # 分层依赖契约（grimp 静态解析，无需项目运行时依赖）
      - run: uv run --no-sync lint-imports
      # async 路由 × 同步 Session 门禁（基线燃尽：新增即红，见 scripts/async_sync_db_baseline.txt）
      - run: uv run --no-sync python scripts/check_async_sync_db.py

  # 安全扫描与 Python 版本无关，独立执行一次，避免矩阵重复及与 lint 结果耦合。
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # 泄密扫描（当前工作树；规则与豁免见 .gitleaks.toml，历史泄露靠轮换处理）
      - name: gitleaks secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact
      # 依赖漏洞扫描（OSV 数据库 × uv.lock 全依赖树，必过门禁）。
      # 豁免清单及理由见 osv-scanner.toml（只出不进）；新告警 = 红，
      # 处置顺序：先试 lock-only 小步升，确认被约束锁死才进豁免。
      - name: osv-scanner dependency audit
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan source -L uv.lock --config=osv-scanner.toml

  typecheck:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"  # 与 uv.lock 同源，见 lint job 注释
          enable-cache: true
          cache-dependency-glob: uv.lock
      # 全量同步：mypy 需要真实三方包的内联类型
      # git 依赖源（gitee）偶发超时，重试兜底；命中 uv 缓存后不再走网络
      - name: uv sync (retry)
        run: |
          for i in 1 2 3; do
            uv sync --python 3.12 --group dev --frozen && exit 0
            echo "uv sync failed (attempt $i), retrying..." >&2
            sleep 15
          done
          exit 1
      - run: uv run --no-sync mypy

  unit:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # 3.12/3.13 双版本均必过（3.13 已于 2026-07-09 首次 CI 全绿后转正）；
    # 3.14 待评估主开发版本切换时一并考虑。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"  # 与 uv.lock 同源，见 lint job 注释
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync (retry)
        run: |
          for i in 1 2 3; do
            uv sync --python ${{ matrix.python-version }} --group dev --frozen && exit 0
            echo "uv sync failed (attempt $i), retrying..." >&2
            sleep 15
          done
          exit 1
      # rag_tokenizer/synonym 运行时需要 NLTK 语料（与 download_deps.py 清单一致）
      - name: Provision NLTK corpora
        run: uv run --no-sync python -m nltk.downloader punkt punkt_tab wordnet
      - run: uv run --no-sync pytest tests/unit -q --cov --cov-branch --cov-report=xml:coverage-unit.xml
      - uses: codecov/codecov-action@v5
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  integration:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    uses: ./.github/workflows/python-integration.yml
    with:
      lane: core
      shard: ${{ matrix.shard }}

  consumer:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    uses: ./.github/workflows/python-integration.yml
    with:
      lane: consumer

  smoke:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    uses: ./.github/workflows/python-integration.yml
    with:
      lane: smoke

  integration-infinity:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python
      - name: Real Infinity contracts
        run: make integration-infinity
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-infinity-evidence
          path: .test-results/
          include-hidden-files: true
          retention-days: 14

  go:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_go
          POSTGRES_PASSWORD: '123456'
          POSTGRES_DB: multirag_go_models_a_skills_ci
        ports: ['5432/tcp']
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=536870912
          --health-cmd "pg_isready -U ci_go -d multirag_go_models_a_skills_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: valkey/valkey:8
        ports: ['6379/tcp']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.5'
      - uses: ./.github/actions/setup-go-native
      - name: Private configuration for owned MinIO test buckets
        run: |
          set -euo pipefail
          docker run -d --name ci-go-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=12345678 \
            pgsty/minio:RELEASE.2026-03-25T00-00-00Z server /data
          export MULTIRAG_GO_TEST_MINIO_CONFIG="$RUNNER_TEMP/go-minio.json"
          echo "MULTIRAG_GO_TEST_MINIO_CONFIG=$MULTIRAG_GO_TEST_MINIO_CONFIG" >> "$GITHUB_ENV"
          umask 077
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['MULTIRAG_GO_TEST_MINIO_CONFIG']).write_text(json.dumps({
              'host': '127.0.0.1:9000', 'user': 'minioadmin',
              'password': '12345678', 'secure': False,
          }))
          PY
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs --tail 100 ci-go-minio
          exit 1
      - name: Build, vet and separate command binaries
        run: |
          set -euo pipefail
          mkdir -p .test-results/go/bin
          git rev-parse HEAD > .test-results/go/backend-sha.txt
          test "$(cat .test-results/go/backend-sha.txt)" = "$GITHUB_SHA"
          go version | tee .test-results/go/toolchain.txt
          cmake --version >> .test-results/go/toolchain.txt
          git -C resource rev-parse HEAD >> .test-results/go/toolchain.txt
          go build ./internal/...
          go vet ./internal/...
          for command in multirag_cli server_main admin_server; do
            go build -o ".test-results/go/bin/$command" "./cmd/$command.go"
          done
      - name: Prepare owned management regression database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PG_PORT: ${{ job.services.postgres.ports[5432] }}
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          PGUSER: ci_go
          PGPASSWORD: '123456'
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('.test-results/go/after33-database.json').write_text(json.dumps({
              'database': 'multirag_after33_g_ci', 'host': '127.0.0.1',
              'port': int(os.environ['PG_PORT']), 'container': os.environ['PG_CONTAINER'],
              'status': 'registered-before-create', 'borrowed_service': True,
          }, indent=2))
          private = Path(os.environ['RUNNER_TEMP']) / 'go-after10bbe.json'
          probe = Path(os.environ['RUNNER_TEMP']) / 'go-after10bbe-probe.json'
          Path('.test-results/go/deepseek-config.json').write_text(json.dumps({
              'paths': [str(private), str(probe)], 'host': '127.0.0.1',
              'port': int(os.environ['PG_PORT']),
              'status': 'registered-before-create', 'credentials_omitted': True,
          }, indent=2))
          from urllib.parse import quote
          import secrets
          dsn = ('postgres://' + quote(os.environ['PGUSER'], safe='') + ':' +
                 quote(os.environ['PGPASSWORD'], safe='') + '@127.0.0.1:' +
                 os.environ['PG_PORT'] + '/postgres?sslmode=disable')
          for path, listen in [(private, '127.0.0.1:18961'), (probe, '127.0.0.1:18962')]:
              with path.open('x') as output:
                  os.chmod(path, 0o600)
                  json.dump({
                      'admin_dsn': dsn, 'pg_endpoint': '127.0.0.1:' + os.environ['PG_PORT'],
                      'listen': listen, 'mysql_listen': '127.0.0.1:18962',
                      'multirag': {'secret_key': secrets.token_hex(32)},
                  }, output)
          PY
          psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE multirag_after33_g_ci'
      - name: Prepare isolated Go file, memory and recovery services
        env:
          PG_PORT: ${{ job.services.postgres.ports[5432] }}
          REDIS_PORT: ${{ job.services.redis.ports[6379] }}
        run: |
          set -euo pipefail
          sudo sysctl -w vm.max_map_count=262144
          python3 - <<'PY'
          import json, os, socket, subprocess, sys, time, urllib.request
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from resource_journal import Journal
          root = Path('.test-results/go')
          private = Path(os.environ['RUNNER_TEMP'])
          identity = os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          images = {'ci-go-afterdcf-es': 'elasticsearch:8.11.3',
                    'ci-go-afterdcf-infinity': 'infiniflow/infinity:v0.7.0'}
          files = [private / 'go-afterdcf.json', private / 'go-afterdcf-infinity.json',
                   private / 'go-afterdcf-infinity.toml']
          journal = Journal(root / 'afterdcf-services.jsonl', create=True)
          journal.event('reserve-ci-services', containers=images, identity=identity,
                        private_paths=[str(path) for path in files],
                        outputs=['afterdcf-services.json', 'afterdcf-cleanup.json'],
                        diagnostics=[name + '.log' for name in images])
          ports, listeners = [], []
          for _ in range(3):
              journal.event('reserve-ci-port', host='127.0.0.1', port=0, owner=identity)
              listener = socket.socket()
              listener.bind(('127.0.0.1', 0))
              listeners.append(listener)
              ports.append(listener.getsockname()[1])
          es, thrift, http = ports
          journal.event('reserve-ci-container-ports', es=es, infinity_thrift=thrift, infinity_http=http)
          for listener in listeners:
              listener.close()
          record = {'identity': identity, 'containers': images, 'ports': ports,
                    'private_paths': [str(path) for path in files]}
          with (root / 'afterdcf-services.json').open('x') as output:
              json.dump(record, output); output.flush(); os.fsync(output.fileno())
          config = Path('docker/infinity_conf.toml').read_text()
          config = config.replace('buffer_manager_size      = "8GB"', 'buffer_manager_size      = "1GB"')
          config = config.replace('memindex_memory_quota    = "1GB"', 'memindex_memory_quota    = "512MB"')
          config = config.replace('connection_pool_size     = 128', 'connection_pool_size     = 32')
          os.umask(0o077)
          with files[2].open('x') as output:
              output.write(config); output.flush(); os.fsync(output.fileno())
          label = 'multirag.ci.afterdcf=' + identity
          subprocess.run(['docker', 'run', '-d', '--name', 'ci-go-afterdcf-es', '--label', label,
                          '--memory', '2g', '-p', f'127.0.0.1:{es}:9200',
                          '-e', 'discovery.type=single-node', '-e', 'xpack.security.enabled=false',
                          '-e', 'ES_JAVA_OPTS=-Xms512m -Xmx512m', images['ci-go-afterdcf-es']], check=True)
          subprocess.run(['docker', 'run', '-d', '--name', 'ci-go-afterdcf-infinity', '--label', label,
                          '--memory', '2g', '--tmpfs', '/var/infinity:rw,size=2147483648',
                          '-p', f'127.0.0.1:{thrift}:23817', '-p', f'127.0.0.1:{http}:23820',
                          '--ulimit', 'nofile=500000:500000',
                          '-v', str(files[2]) + ':/infinity_conf.toml:ro',
                          images['ci-go-afterdcf-infinity'], '-f', '/infinity_conf.toml'], check=True)
          for endpoint in [f'http://127.0.0.1:{es}', f'http://127.0.0.1:{http}/admin/node/current']:
              for attempt in range(90):
                  try:
                      with urllib.request.urlopen(endpoint, timeout=2) as response:
                          if response.status == 200:
                              break
                  except OSError:
                      pass
                  time.sleep(2)
              else:
                  raise RuntimeError('Owned Go service did not become ready')
          configs = [
              {'Database': {'Driver': 'postgres', 'Host': '127.0.0.1', 'Port': int(os.environ['PG_PORT']),
                            'Database': 'postgres', 'Username': 'ci_go', 'Password': '123456', 'Schema': 'usr_ai'},
               'Redis': {'Host': '127.0.0.1', 'Port': int(os.environ['REDIS_PORT']), 'DB': 1},
               'MinIO': {'Host': '127.0.0.1:9000', 'User': 'minioadmin', 'Password': '12345678'},
               'Elasticsearch': {'Hosts': f'http://127.0.0.1:{es}'}},
              {'URI': f'127.0.0.1:{thrift}', 'DBName': 'default_db'},
          ]
          for path, value in zip(files[:2], configs, strict=True):
              with path.open('x') as output:
                  json.dump(value, output); output.flush(); os.fsync(output.fileno())
          journal.event('ci-services-ready', identity=identity, ports=ports)
          journal.close()
          PY
      - name: Go race regression (live opt-ins remain explicit)
        env:
          MULTIRAG_SKILL_EMBEDDING_DSN: postgres://ci_go:123456@127.0.0.1:${{ job.services.postgres.ports[5432] }}/multirag_go_models_a_skills_ci?sslmode=disable
          MULTIRAG_AFTER33_G_DSN: postgres://ci_go:123456@127.0.0.1:${{ job.services.postgres.ports[5432] }}/multirag_after33_g_ci?sslmode=disable
          MULTIRAG_AFTER33_CLI: ${{ github.workspace }}/.test-results/go/bin/multirag_cli
          MULTIRAG_DEEPSEEK_CONFIG: ${{ runner.temp }}/go-after10bbe.json
          MULTIRAG_QWEN_CONFIG: ${{ runner.temp }}/go-after10bbe.json
          MULTIRAG_AFTER10BBE_S_CONFIG: ${{ runner.temp }}/go-after10bbe.json
          MULTIRAG_AFTERDCF_G_CONFIG: ${{ runner.temp }}/go-afterdcf.json
          MULTIRAG_AFTERDCF_G_INFINITY_CONFIG: ${{ runner.temp }}/go-afterdcf-infinity.json
        run: |
          set -euo pipefail
          go test -race -count=1 -json ./internal/... | tee .test-results/go/tests.jsonl
          REQUIRE_SERVICES=1 MULTIRAG_AFTER10BBE_G_CONFIG="$RUNNER_TEMP/go-after10bbe.json" \
            go test -race -tags integration -count=1 -json ./internal/handler \
              -run '^(TestAfter10bbeAgentMetadataHTTPAndSQL|TestHandlerInternalErrorsSQLHTTP)$' | tee -a .test-results/go/tests.jsonl
          REQUIRE_SERVICES=1 MULTIRAG_AFTER10BBE_G_CONFIG="$RUNNER_TEMP/go-after10bbe-probe.json" \
            go test -race -tags integration -count=1 -json ./internal/service \
              -run '^TestAfter10bbeDBProbeMySQLProtocol$' | tee -a .test-results/go/tests.jsonl
          python3 scripts/ci_checks.py go-audit --reports .test-results/go
      - name: Go memory service diagnostics and precise cleanup
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, socket, subprocess
          from pathlib import Path
          root = Path('.test-results/go')
          path = root / 'afterdcf-services.json'
          if not path.exists():
              raise SystemExit(0)
          record = json.loads(path.read_text())
          for name in record['containers']:
              inventory = subprocess.check_output(['docker', 'container', 'ls', '-a', '--format', '{{.Names}}'], text=True).splitlines()
              if name in inventory:
                  container = json.loads(subprocess.check_output(['docker', 'inspect', name], text=True))[0]
                  if container['Config']['Labels'].get('multirag.ci.afterdcf') != record['identity']:
                      raise RuntimeError('Refuse cleanup of unowned Go service')
                  logs = subprocess.run(['docker', 'logs', name], capture_output=True, text=True)
                  (root / (name + '.log')).write_text(logs.stdout + logs.stderr)
                  subprocess.run(['docker', 'rm', '-f', '-v', name], check=True)
              inventory = subprocess.check_output(['docker', 'container', 'ls', '-a', '--format', '{{.Names}}'], text=True).splitlines()
              if name in inventory:
                  raise RuntimeError('Owned Go service remains')
          for port in record['ports']:
              with socket.socket() as reader:
                  reader.settimeout(1)
                  if reader.connect_ex(('127.0.0.1', port)) == 0:
                      raise RuntimeError('Owned Go port remains open')
          for name in record['private_paths']:
              Path(name).unlink(missing_ok=True)
          record.update(containers_absent=True, ports_closed=True, private_files_absent=True)
          with (root / 'afterdcf-cleanup.json').open('x') as output:
              json.dump(record, output); output.flush(); os.fsync(output.fileno())
          PY
      - name: Drop owned management regression database
        if: always()
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          PGUSER: ci_go
          PGPASSWORD: '123456'
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS multirag_after33_g_ci WITH (FORCE)'
          remaining=$(psql -At \
            -c "SELECT count(*) FROM pg_database WHERE datname = 'multirag_after33_g_ci'")
          test "$remaining" = 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('.test-results/go/after33-database.json')
          record = json.loads(path.read_text()) if path.exists() else {'database': 'multirag_after33_g_ci'}
          record.update(status='cleaned', independent_database_absent=True)
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(record, indent=2))
          PY
      - name: MinIO diagnostics and cleanup
        if: always()
        run: |
          mkdir -p .test-results/go
          docker logs --tail 200 ci-go-minio > .test-results/go/minio.log 2>&1 || true
          docker rm -f -v ci-go-minio >/dev/null 2>&1 || true
          rm -f "$MULTIRAG_GO_TEST_MINIO_CONFIG"
          rm -f "$RUNNER_TEMP/go-after10bbe.json" "$RUNNER_TEMP/go-after10bbe-probe.json"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: go-evidence
          path: .test-results/go/
          retention-days: 14

  required:
    name: ci-required
    if: always()
    needs: [changes, lint, security, typecheck, unit, integration, integration-infinity, consumer, go, smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Require every applicable job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_checks.py required
      - if: needs.changes.outputs.runtime == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: integration-core-*
          merge-multiple: true
          path: .ci-reports
      - name: Verify complete same-SHA core coverage
        if: needs.changes.outputs.runtime == 'true'
        run: python3 scripts/ci_checks.py audit --reports .ci-reports
