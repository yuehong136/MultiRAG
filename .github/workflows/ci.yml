# MultiRAG CI —— 与本地 Makefile 对应的分层验证
#   lint      = make lint      (Tier 0)
#   security  = gitleaks + osv-scanner（版本无关，独立执行一次）
#   typecheck = make typecheck (Tier 1)
#   unit      = make coverage  (Tier 2)
#   core shards / consumers / Go / smoke are independent required jobs; quality is separate.
name: ci

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: python3 scripts/ci_checks.py scope

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # dev 工具组（ruff/import-linter/门禁脚本）已验证 3.13 可跑，两版本均必过；
    # 版本无关的锁文件一致性检查只在 3.12 跑一次省时避噪。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          # 与本地工具链、uv.lock 产出版本对齐（pyproject [tool.uv] required-version
          # 同区间）。CI 浮动装新版 uv 会让 `uv lock --check` 因锁格式重写而误报漂移。
          # 升级 uv 时本地、此文件各处 pin、重锁 uv.lock 三者必须同一提交内完成。
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --python ${{ matrix.python-version }} --only-group dev --frozen
      # 锁文件一致性：pyproject 改了但 uv.lock 未更新即失败
      - run: uv lock --check
        if: matrix.python-version == '3.12'
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check --output-format=github .
      # 分层依赖契约（grimp 静态解析，无需项目运行时依赖）
      - run: uv run --no-sync lint-imports
      # async 路由 × 同步 Session 门禁（基线燃尽：新增即红，见 scripts/async_sync_db_baseline.txt）
      - run: uv run --no-sync python scripts/check_async_sync_db.py

  # 安全扫描与 Python 版本无关，独立执行一次，避免矩阵重复及与 lint 结果耦合。
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # 泄密扫描（当前工作树；规则与豁免见 .gitleaks.toml，历史泄露靠轮换处理）
      - name: gitleaks secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact
      # 依赖漏洞扫描（OSV 数据库 × uv.lock 全依赖树，必过门禁）。
      # 豁免清单及理由见 osv-scanner.toml（只出不进）；新告警 = 红，
      # 处置顺序：先试 lock-only 小步升，确认被约束锁死才进豁免。
      - name: osv-scanner dependency audit
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan source -L uv.lock --config=osv-scanner.toml

  typecheck:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"  # 与 uv.lock 同源，见 lint job 注释
          enable-cache: true
          cache-dependency-glob: uv.lock
      # 全量同步：mypy 需要真实三方包的内联类型
      # git 依赖源（gitee）偶发超时，重试兜底；命中 uv 缓存后不再走网络
      - name: uv sync (retry)
        run: |
          for i in 1 2 3; do
            uv sync --python 3.12 --group dev --frozen && exit 0
            echo "uv sync failed (attempt $i), retrying..." >&2
            sleep 15
          done
          exit 1
      - run: uv run --no-sync mypy

  unit:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # 3.12/3.13 双版本均必过（3.13 已于 2026-07-09 首次 CI 全绿后转正）；
    # 3.14 待评估主开发版本切换时一并考虑。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"  # 与 uv.lock 同源，见 lint job 注释
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync (retry)
        run: |
          for i in 1 2 3; do
            uv sync --python ${{ matrix.python-version }} --group dev --frozen && exit 0
            echo "uv sync failed (attempt $i), retrying..." >&2
            sleep 15
          done
          exit 1
      # rag_tokenizer/synonym 运行时需要 NLTK 语料（与 download_deps.py 清单一致）
      - name: Provision NLTK corpora
        run: uv run --no-sync python -m nltk.downloader punkt punkt_tab wordnet
      - run: uv run --no-sync pytest tests/unit -q --cov --cov-branch --cov-report=xml:coverage-unit.xml
      - uses: codecov/codecov-action@v5
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  integration:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    uses: ./.github/workflows/python-integration.yml
    with:
      lane: core
      shard: ${{ matrix.shard }}

  consumer:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    uses: ./.github/workflows/python-integration.yml
    with:
      lane: consumer

  smoke:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    uses: ./.github/workflows/python-integration.yml
    with:
      lane: smoke

  integration-infinity:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python
      - name: Real Infinity contracts
        run: make integration-infinity
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-infinity-evidence
          path: .test-results/
          include-hidden-files: true
          retention-days: 14

  go:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.1'
      - uses: ./.github/actions/setup-go-native
      - name: Private configuration for owned MinIO test buckets
        run: |
          set -euo pipefail
          docker run -d --name ci-go-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=12345678 \
            pgsty/minio:RELEASE.2026-03-25T00-00-00Z server /data
          export MULTIRAG_GO_TEST_MINIO_CONFIG="$RUNNER_TEMP/go-minio.json"
          echo "MULTIRAG_GO_TEST_MINIO_CONFIG=$MULTIRAG_GO_TEST_MINIO_CONFIG" >> "$GITHUB_ENV"
          umask 077
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['MULTIRAG_GO_TEST_MINIO_CONFIG']).write_text(json.dumps({
              'host': '127.0.0.1:9000', 'user': 'minioadmin',
              'password': '12345678', 'secure': False,
          }))
          PY
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs --tail 100 ci-go-minio
          exit 1
      - name: Build, vet and separate command binaries
        run: |
          set -euo pipefail
          mkdir -p .test-results/go/bin
          git rev-parse HEAD > .test-results/go/backend-sha.txt
          test "$(cat .test-results/go/backend-sha.txt)" = "$GITHUB_SHA"
          go version | tee .test-results/go/toolchain.txt
          cmake --version >> .test-results/go/toolchain.txt
          git -C resource rev-parse HEAD >> .test-results/go/toolchain.txt
          go build ./internal/...
          go vet ./internal/...
          for command in multirag_cli server_main admin_server; do
            go build -o ".test-results/go/bin/$command" "./cmd/$command.go"
          done
      - name: Go race regression (live opt-ins remain explicit)
        run: |
          set -euo pipefail
          go test -race -count=1 -json ./internal/... | tee .test-results/go/tests.jsonl
          python3 scripts/ci_checks.py go-audit --reports .test-results/go
      - name: MinIO diagnostics and cleanup
        if: always()
        run: |
          mkdir -p .test-results/go
          docker logs --tail 200 ci-go-minio > .test-results/go/minio.log 2>&1 || true
          docker rm -f -v ci-go-minio >/dev/null 2>&1 || true
          rm -f "$MULTIRAG_GO_TEST_MINIO_CONFIG"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: go-evidence
          path: .test-results/go/
          retention-days: 14

  required:
    name: ci-required
    if: always()
    needs: [changes, lint, security, typecheck, unit, integration, integration-infinity, consumer, go, smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Require every applicable job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_checks.py required
      - if: needs.changes.outputs.runtime == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: integration-core-*
          merge-multiple: true
          path: .ci-reports
      - name: Verify complete same-SHA core coverage
        if: needs.changes.outputs.runtime == 'true'
        run: python3 scripts/ci_checks.py audit --reports .ci-reports
