# pre-commit 钩子：git commit 时自动执行 Tier 0 检查
# 启用（可选，每人一次）：uv run pre-commit install
# ruff 走本地 uv 环境（与 uv.lock 锁定版本一致，避免镜像仓库版本漂移）
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run --no-sync ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-yaml
        exclude: ^docker/
  # 泄密扫描（staged 内容；规则与豁免见 .gitleaks.toml）
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
