# ============================================================
# MultiRAG macOS 专用配置（Apple Silicon）
# 
# 用途：在 Apple Silicon Mac (M1/M2/M3) 上运行 x86_64 容器
# 原理：通过 Rosetta 2 模拟 x86_64 架构
# 
# 使用方式：
#   docker compose -f docker-compose-macos.yml up -d
#   或指定 profile：
#   docker compose -f docker-compose-macos.yml --profile tei up -d
#
# 注意：
#   - 需要 Docker Desktop 启用 "Use Rosetta for x86_64/amd64 emulation"
#   - 性能比原生 ARM 慢约 30-50%
#   - 主要用于运行没有 ARM 版本的镜像（如 TEI）
# ============================================================

version: '3.8'

services:
  # ========== MultiRAG 主服务 (macOS) ==========
  multirag:
    platform: linux/amd64
    image: multirag:latest
    container_name: multirag
    restart: unless-stopped
    
    # ========== 端口映射 ==========
    ports:
      # ----------------------------------------------------------
      # Nginx 反向代理端口（推荐生产环境使用）
      # ----------------------------------------------------------
      - "${SVR_WEB_HTTP_PORT:-80}:80"       # HTTP 入口
      - "${SVR_WEB_HTTPS_PORT:-443}:443"    # HTTPS 入口（需配置 SSL 证书）
      
      # ----------------------------------------------------------
      # 直连后端端口（兼容模式 / 调试用）
      # 如需关闭直连，注释以下两行即可
      # ----------------------------------------------------------
      - "${SVR_HTTP_PORT:-8123}:8123"       # 主服务 API 直连
      - "${ADMIN_SVR_HTTP_PORT:-8130}:8130" # 管理后台 API 直连
    
    env_file: 
      - ./.env
    
    environment:
      - PYTHONIOENCODING=utf-8
      - LANG=zh_CN.UTF-8
      - LC_ALL=zh_CN.UTF-8
      - ADMIN_SVR_HTTP_PORT=8130
      - WS=1
      - ENABLE_WEBSERVER=${ENABLE_WEBSERVER:-1}
    
    # ========== 数据卷挂载 ==========
    volumes:
      # ----------------------------------------------------------
      # Nginx 配置文件
      # ----------------------------------------------------------
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/multirag.conf:/etc/nginx/conf.d/multirag.conf
      # HTTPS 配置（启用 HTTPS 时取消注释）
      # - ./nginx/multirag.https.conf:/etc/nginx/conf.d/multirag.conf
      # SSL 证书（启用 HTTPS 时取消注释）
      # - /path/to/ssl/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      # - /path/to/ssl/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      
      # ----------------------------------------------------------
      # 应用配置
      # ----------------------------------------------------------
      - ../configs:/multirag/configs
      - ./entrypoint.sh:/multirag/entrypoint.sh
      - ../logs:/multirag/logs
      # 前端静态文件（预留，等前端开发后启用）
      # - ../web/dist:/multirag/web/dist
    
    command: []
    
    networks:
      - multirag
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ========== TEI 服务 (macOS - 通过 Rosetta 模拟) ==========
  # TEI 只有 x86_64 版本，必须使用 platform: linux/amd64
  tei:
    profiles:
      - tei
    platform: linux/amd64
    image: ${TEI_IMAGE_CPU:-infiniflow/text-embeddings-inference:cpu-1.8}
    hostname: tei
    container_name: tei-macos
    restart: unless-stopped
    
    ports:
      - "${TEI_PORT:-6380}:80"
    
    env_file: ./.env
    
    environment:
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - HF_TOKEN=${HF_TOKEN:-}
    
    volumes:
      - tei-models:/data
    
    command: 
      - "--model-id"
      - "${TEI_MODEL:-BAAI/bge-small-en-v1.5}"
      - "--auto-truncate"
    
    networks:
      - multirag
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

networks:
  multirag:
    driver: bridge

volumes:
  tei-models:
    driver: local



