version: '3.8'

services:
  # ========== MultiRAG 主服务 (CPU 版本) ==========
  multirag-cpu:
    profiles:
      - cpu
    image: multirag:latest
    container_name: multirag
    restart: unless-stopped
    
    # 端口映射
    ports:
      # API 服务端口（默认：根据配置）
      - "${SVR_HTTP_PORT}:8123"
      # Admin 服务端口（需要启用 --enable-adminserver）
      - "${ADMIN_SVR_HTTP_PORT:-8130}:8130"
    
    # 从 .env 文件加载环境变量（ragflow 风格）
    env_file: 
      - ./.env
    
    # 环境变量配置（可以覆盖 .env 中的配置）
    environment:
      # 基础配置
      - PYTHONIOENCODING=utf-8
      - LANG=zh_CN.UTF-8
      - LC_ALL=zh_CN.UTF-8
      
      # Admin Server 端口配置（可选）
      - ADMIN_SVR_HTTP_PORT=8130
      
      # 任务执行器数量
      - WS=1
      
      # Redis 配置（如果使用外部 Redis）
      # - REDIS_HOST=redis
      # - REDIS_PORT=6379
      # - REDIS_PASSWORD=
    
    # 数据卷挂载
    volumes:
      # 配置文件
      - ../configs:/multirag/configs
      - ./entrypoint.sh:/multirag/entrypoint.sh
      # 日志目录
      - ../logs:/multirag/logs
      # 源代码挂载（开发模式）
#      - ../api:/multirag/api
#      - ../core:/multirag/core
#      - ../common:/multirag/common
      # 数据目录（根据实际情况调整）
      # - ../data:/root/.ragdatav
    
    # 默认命令：启动所有服务（Redis、API Server、TaskExecutor）
    # 不启动 Admin Server
    command: []
    
    # 网络配置
    networks:
      - multirag
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========== MultiRAG 主服务 (GPU 版本) ==========
  multirag-gpu:
    profiles:
      - gpu
    image: multirag:latest
    container_name: multirag
    restart: unless-stopped
    
    ports:
      - "8123:8123"
      - "${ADMIN_SVR_HTTP_PORT:-8130}:8130"
    
    env_file: 
      - ./.env
    
    environment:
      - PYTHONIOENCODING=utf-8
      - LANG=zh_CN.UTF-8
      - LC_ALL=zh_CN.UTF-8
      - ADMIN_SVR_HTTP_PORT=8130
      - WS=1
    
    volumes:
      - ../configs:/multirag/configs
      - ../logs:/multirag/logs
      # 源代码挂载（开发模式）
      - ../api:/multirag/api
      - ../core:/multirag/core
      - ../common:/multirag/common
    
    command: []
    
    networks:
      - multirag
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # GPU 资源配置
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ========== TEI 服务 (CPU 版本) ==========
  # Text Embeddings Inference - 用于提供独立的 embedding 服务
  # 使用方式：在 .env 中设置 COMPOSE_PROFILES=cpu,tei-cpu
  tei-cpu:
    profiles:
      - tei-cpu
    image: ${TEI_IMAGE_CPU:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8}
    hostname: tei
    container_name: tei-cpu
    restart: unless-stopped
    
    ports:
      - "${TEI_PORT:-6380}:80"
    
    env_file: ./.env
    
    environment:
      # HuggingFace 镜像站点（可选）
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    
    volumes:
      # 模型缓存目录
      - ${TEI_MODEL_CACHE:-~/.cache/huggingface}:/data
    
    # 启动命令：指定模型和自动截断
    command: ["--model-id", "${TEI_MODEL:-BAAI/bge-small-en-v1.5}", "--auto-truncate"]
    
    networks:
      - multirag
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ========== TEI 服务 (GPU 版本) ==========
  # 使用方式：在 .env 中设置 COMPOSE_PROFILES=gpu,tei-gpu
  tei-gpu:
    profiles:
      - tei-gpu
    image: ${TEI_IMAGE_GPU:-ghcr.io/huggingface/text-embeddings-inference:1.8}
    hostname: tei
    container_name: tei-gpu
    restart: unless-stopped
    
    ports:
      - "${TEI_PORT:-6380}:80"
    
    env_file: ./.env
    
    environment:
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    
    volumes:
      - ${TEI_MODEL_CACHE:-~/.cache/huggingface}:/data
    
    command: ["--model-id", "${TEI_MODEL:-BAAI/bge-m3}", "--auto-truncate"]
    
    networks:
      - multirag
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    
    # GPU 资源配置
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ========== 可选：外部 Redis 服务 ==========
  # 如果不想使用容器内置的 Redis，可以使用独立的 Redis 服务
  # redis:
  #   image: redis:7.4.3-alpine
  #   container_name: multirag-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   command: redis-server --appendonly yes
  #   networks:
  #     - multirag

networks:
  multirag:
    driver: bridge

