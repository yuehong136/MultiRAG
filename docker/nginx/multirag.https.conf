# ============================================================
# MultiRAG HTTPS 站点配置（预留）
# 
# 用途：生产环境 HTTPS 配置模板
# 
# 使用前需要：
#   1. 将 your-multirag-domain.com 替换为实际域名
#   2. 配置 SSL 证书路径
#   3. 在 nginx.conf 中将 include 改为此文件
# 
# 端口映射（参考 configs/service_conf.yaml）:
#   - 主服务 API: 8123
#   - 管理后台 API: 8130
#   - Nginx 对外暴露: 80 (重定向) / 443 (HTTPS)
# ============================================================

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name your-multirag-domain.com;
    return 301 https://$host$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl;
    server_name your-multirag-domain.com;

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    
    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 前端静态资源目录（预留，等前端开发后启用）
    root /multirag/web/dist;

    # Gzip 压缩配置
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 9;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png application/json;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # 管理后台 API 路由 -> 8130
    location ~ ^/api/v1/admin {
        proxy_pass http://localhost:8130;
        include proxy.conf;
    }

    # 主服务 API 路由 -> 8123
    location ~ ^/(v1|api) {
        proxy_pass http://localhost:8123;
        include proxy.conf;
    }

    # 前端静态资源（预留）
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存配置（预留）
    location ~ ^/static/(css|js|media)/ {
        expires 10y;
        access_log off;
    }
}

