# ============================================================
# MultiRAG HTTP 站点配置
# 
# 端口映射（参考 configs/service_conf.yaml）:
#   - 主服务 API: 8123
#   - 管理后台 API: 8130
#   - Nginx 对外暴露: 80
# ============================================================

server {
    listen 80;
    server_name _;
    
    # 前端静态资源目录（预留，等前端开发后启用）
    root /multirag/web/dist;

    # Gzip 压缩配置
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 9;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png application/json;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # 管理后台 API 路由 -> 8130
    location ~ ^/api/v1/admin {
        proxy_pass http://localhost:8130;
        include proxy.conf;
    }

    # 主服务 API 路由 -> 8123
    location ~ ^/(v1|api) {
        proxy_pass http://localhost:8123;
        include proxy.conf;
    }

    # 前端静态资源（预留）
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存配置（预留）
    location ~ ^/static/(css|js|media)/ {
        expires 10y;
        access_log off;
    }
}

