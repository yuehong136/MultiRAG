# Isolated upgrade rehearsal only. Supply a unique project name with `-p`.
# No external volumes or shared MultiRAG service names are used.
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    mem_limit: 128m
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: ["etcd", "-advertise-client-urls=http://etcd:2379", "-listen-client-urls", "http://0.0.0.0:2379", "--data-dir", "/etcd"]
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    mem_limit: 192m
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${REHEARSAL_MINIO_PORT:-29010}:9000"
    volumes:
      - minio_data:/minio_data

  standalone:
    image: ${REHEARSAL_MILVUS_IMAGE:-milvusdb/milvus:v2.6.22}
    mem_limit: ${REHEARSAL_MILVUS_MEMORY:-1g}
    cpus: 2
    security_opt:
      - seccomp:unconfined
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
      GOMAXPROCS: "2"
      OMP_NUM_THREADS: "2"
    ports:
      - "127.0.0.1:${REHEARSAL_MILVUS_PORT:-29530}:19530"
      - "127.0.0.1:${REHEARSAL_MILVUS_METRICS_PORT:-29091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio

  volume-init:
    profiles: ["upgrade"]
    image: milvusdb/milvus:v3.0.6
    user: "0:0"
    network_mode: none
    read_only: true
    mem_limit: 64m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        uid="$$(id -u milvus)"
        gid="$$(id -g milvus)"
        marker="/var/lib/milvus/.milvus-volume-owner-$${uid}-$${gid}"
        if [ ! -e "$${marker}" ]; then
          chown -R "$${uid}:$${gid}" /var/lib/milvus
          touch "$${marker}"
          chown "$${uid}:$${gid}" "$${marker}"
        fi
    volumes:
      - milvus_data:/var/lib/milvus

volumes:
  etcd_data:
  minio_data:
  milvus_data:
