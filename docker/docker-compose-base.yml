# docker-compose-base.yml
# MultiRAG 基础设施服务配置
# 此文件定义所有基础设施服务（数据库、缓存、存储等），供主 docker-compose.yml 通过 include 引用
#
# 使用方式：
# 1. 在 docker-compose.yml 中通过 include 引用此文件
# 2. 使用 profiles 按需启用服务：
#    - postgresql: PostgreSQL 数据库（必需）
#    - elasticsearch: Elasticsearch 搜索引擎
#    - opensearch: OpenSearch 搜索引擎
#    - infinity: Infinity 向量数据库
#    - milvus: Milvus 向量数据库
#    - oceanbase: OceanBase 向量数据库
#    - sandbox: 沙箱执行器
#    - tei-cpu / tei-gpu: Text Embeddings Inference 服务

services:
  # ========== PostgreSQL 数据库服务 ==========
  postgres:
    profiles:
      - postgresql
    image: postgres:16-alpine
    container_name: multirag-postgres
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-usr_ai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123456}
      - POSTGRES_DB=${POSTGRES_DBNAME:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - multirag
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usr_ai}"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: on-failure

  # ========== Elasticsearch 搜索引擎 ==========
  es01:
    profiles:
      - elasticsearch
    image: elasticsearch:${STACK_VERSION:-8.11.3}
    container_name: multirag-es01
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT:-9200}:9200"
    env_file: .env
    environment:
      - node.name=es01
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-infini_rag_flow}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
    mem_limit: ${MEM_LIMIT:-8073741824}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - multirag
    restart: on-failure

  # ========== OpenSearch 搜索引擎 ==========
  opensearch01:
    profiles:
      - opensearch
    image: opensearchproject/opensearch:2.19.1
    container_name: multirag-opensearch01
    volumes:
      - osdata01:/usr/share/opensearch/data
    ports:
      - "${OS_PORT:-9201}:9201"
    env_file: .env
    environment:
      - node.name=opensearch01
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-infini_rag_flow_OS_01}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-infini_rag_flow_OS_01}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - plugins.security.disabled=false
      - plugins.security.ssl.http.enabled=false
      - plugins.security.ssl.transport.enabled=true
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
      - http.port=9201
    mem_limit: ${MEM_LIMIT:-8073741824}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:9201"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - multirag
    restart: on-failure

  # ========== Infinity 向量数据库 ==========
  infinity:
    profiles:
      - infinity
    image: infiniflow/infinity:v0.6.5
    container_name: multirag-infinity
    volumes:
      - infinity_data:/var/infinity
      - ./infinity_conf.toml:/infinity_conf.toml
    command: ["-f", "/infinity_conf.toml"]
    ports:
      - "${INFINITY_THRIFT_PORT:-23817}:23817"
      - "${INFINITY_HTTP_PORT:-23820}:23820"
      - "${INFINITY_PSQL_PORT:-5433}:5432"
    env_file: .env
    mem_limit: ${MEM_LIMIT:-8073741824}
    ulimits:
      nofile:
        soft: 500000
        hard: 500000
    networks:
      - multirag
    healthcheck:
      test: ["CMD", "curl", "http://localhost:23820/admin/node/current"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: on-failure

  # ========== Milvus 向量数据库 ==========
  # 参考官方配置：https://github.com/milvus-io/milvus/releases/download/v2.6.7/milvus-standalone-docker-compose.yml
  milvus-etcd:
    profiles:
      - milvus
    image: quay.io/coreos/etcd:v3.5.25
    container_name: multirag-milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd_data:/etcd
    command: ["etcd", "-advertise-client-urls=http://milvus-etcd:2379", "-listen-client-urls", "http://0.0.0.0:2379", "--data-dir", "/etcd"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - multirag
    restart: on-failure

  milvus-minio:
    profiles:
      - milvus
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: multirag-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "${MILVUS_MINIO_PORT:-9010}:9000"
      - "${MILVUS_MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - milvus_minio_data:/minio_data
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - multirag
    restart: on-failure

  milvus-standalone:
    profiles:
      - milvus
    image: milvusdb/milvus:v2.6.7
    container_name: multirag-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MQ_TYPE: woodpecker
      COMMON_SECURITY_AUTHORIZATIONENABLED: ${MILVUS_AUTH_ENABLED:-false}
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_GRPC_PORT:-9091}:9091"
    depends_on:
      - milvus-etcd
      - milvus-minio
    networks:
      - multirag
    restart: on-failure

  # ========== OceanBase 向量数据库 ==========
  oceanbase:
    profiles:
      - oceanbase
    image: oceanbase/oceanbase-ce:4.4.1.0-100000032025101610
    container_name: multirag-oceanbase
    volumes:
      - ob_data:/root/ob
      - ./oceanbase/conf:/root/.obd/cluster
      - ./oceanbase/init.d:/root/boot/init.d
    ports:
      - "${OCEANBASE_PORT:-2881}:2881"
    env_file: .env
    environment:
      - MODE=normal
      - OB_SERVER_IP=127.0.0.1
    mem_limit: ${MEM_LIMIT:-8073741824}
    healthcheck:
      test: ["CMD-SHELL", "obclient -h127.0.0.1 -P2881 -uroot@${OB_TENANT_NAME:-multirag} -p${OB_TENANT_PASSWORD:-dxl_multi_rag} -e \"CREATE DATABASE IF NOT EXISTS ${OCEANBASE_DOC_DBNAME:-multirag_doc};\""]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    networks:
      - multirag
    restart: on-failure

  # ========== Sandbox 沙箱执行器 ==========
  sandbox-executor-manager:
    profiles:
      - sandbox
    image: ${SANDBOX_EXECUTOR_MANAGER_IMAGE:-infiniflow/sandbox-executor-manager:latest}
    container_name: multirag-sandbox
    privileged: true
    ports:
      - "${SANDBOX_EXECUTOR_MANAGER_PORT:-9385}:9385"
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - multirag
    security_opt:
      - no-new-privileges:true
    environment:
      - SANDBOX_EXECUTOR_MANAGER_POOL_SIZE=${SANDBOX_EXECUTOR_MANAGER_POOL_SIZE:-3}
      - SANDBOX_BASE_PYTHON_IMAGE=${SANDBOX_BASE_PYTHON_IMAGE:-infiniflow/sandbox-base-python:latest}
      - SANDBOX_BASE_NODEJS_IMAGE=${SANDBOX_BASE_NODEJS_IMAGE:-infiniflow/sandbox-base-nodejs:latest}
      - SANDBOX_ENABLE_SECCOMP=${SANDBOX_ENABLE_SECCOMP:-false}
      - SANDBOX_MAX_MEMORY=${SANDBOX_MAX_MEMORY:-256m}
      - SANDBOX_TIMEOUT=${SANDBOX_TIMEOUT:-10s}
    healthcheck:
      test: ["CMD", "curl", "http://localhost:9385/healthz"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: on-failure

  # ========== MinIO 对象存储 ==========
  minio:
    profiles:
      - minio
    image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z
    container_name: multirag-minio
    command: ["server", "--console-address", ":9001", "/data"]
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    env_file: .env
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-12345678}
    volumes:
      - minio_data:/data
    networks:
      - multirag
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 120

  # ========== Redis 缓存服务 ==========
  # 使用数组语法避免参数引用问题（参照 ragflow 3fe71ab7 提交）
  redis:
    profiles:
      - redis
    image: valkey/valkey:8
    container_name: multirag-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    env_file: .env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - multirag
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 10s
      retries: 120

  # ========== TEI 服务 (CPU 版本) ==========
  tei-cpu:
    profiles:
      - tei-cpu
    image: ${TEI_IMAGE_CPU:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8}
    hostname: tei
    container_name: multirag-tei-cpu
    ports:
      - "${TEI_PORT:-6380}:80"
    env_file: .env
    environment:
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      - ${TEI_MODEL_CACHE:-tei_data}:/data
    networks:
      - multirag
    command: ["--model-id", "/data/${TEI_MODEL:-BAAI/bge-small-en-v1.5}", "--auto-truncate"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: on-failure

  # ========== TEI 服务 (GPU 版本) ==========
  tei-gpu:
    profiles:
      - tei-gpu
    image: ${TEI_IMAGE_GPU:-ghcr.io/huggingface/text-embeddings-inference:1.8}
    hostname: tei
    container_name: multirag-tei-gpu
    ports:
      - "${TEI_PORT:-6380}:80"
    env_file: .env
    environment:
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      - ${TEI_MODEL_CACHE:-tei_data}:/data
    networks:
      - multirag
    command: ["--model-id", "/data/${TEI_MODEL:-BAAI/bge-m3}", "--auto-truncate"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: on-failure

  # ========== Kibana (Elasticsearch 可视化) ==========
  kibana:
    profiles:
      - kibana
    image: kibana:${STACK_VERSION:-8.11.3}
    container_name: multirag-kibana
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    env_file: .env
    volumes:
      - kibana_data:/usr/share/kibana/data
    depends_on:
      es01:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - multirag
    restart: on-failure

# ========== 数据卷定义 ==========
volumes:
  postgres_data:
    driver: local
  esdata01:
    driver: local
  osdata01:
    driver: local
  infinity_data:
    driver: local
  milvus_etcd_data:
    driver: local
  milvus_minio_data:
    driver: local
  milvus_data:
    driver: local
  ob_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  tei_data:
    driver: local
  kibana_data:
    driver: local

# ========== 网络定义 ==========
networks:
  multirag:
    driver: bridge
