[dependency-groups]
dev = [
    "codecov>=2.1.13",
    "debugpy>=1.8.13",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-playwright>=0.7.2",
    "ruff",
]

[tool.uv]
override-dependencies = [
    # CVE-2026-30922: Denial of Service via unbounded recursion in ASN.1 decoding (CVSS 7.5 HIGH)
    # pyasn1 < 0.6.3 is vulnerable; pulled in transitively via google-auth / rsa / pyasn1-modules
    "pyasn1>=0.6.3",
    "attrs>=23.1.0",
    "cattrs>=23.1.0",
]
python-install-mirror = "http://maven.datav.com/repository/static/indygreg/python-build-standalone/"
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
trusted-host = "mirrors.aliyun.com"
default = true

[tool.ruff]
line-length = 200
exclude = [".venv", "core/svr/discord_svr.py"]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

# 测试用例收集规则（与 pytest 默认一致，显式声明）
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

markers = [
    "p0: critical priority test cases",
    "p1: high priority test cases",
    "p2: medium priority test cases",
    "p3: low priority test cases",
    "smoke: smoke test cases",
    "auth: authentication UI tests",
    "asyncio: mark test as async",
    "integration: integration tests requiring external services (DB/Redis/vector store)",
]

# 运行参数（强制 marker 注册、精简 traceback、彩色输出）
addopts = [
    "--strict-markers",
    "--tb=short",
    "--color=yes",
]

# 屏蔽第三方库的弃用/用户告警噪音（beartype / pydantic / pkg_resources 等），
# 保持测试输出聚焦真正的失败。注意：pytest.warns(...) 不受此影响，仍可断言告警。
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
]
