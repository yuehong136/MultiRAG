[dependency-groups]
dev = [
    "codecov>=2.1.13",
    "debugpy>=1.8.13",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0.0",
    "pytest-playwright>=0.7.2",
    "ruff",
    "types-python-dateutil>=2.9.0.20241206",
    "types-requests>=2.32.0.20250306",
]

test = [
    "tensorflow-cpu>=2.17.0; sys_platform == 'linux'",
]

[tool.uv]
override-dependencies = [
    # CVE-2026-30922: Denial of Service via unbounded recursion in ASN.1 decoding (CVSS 7.5 HIGH)
    # pyasn1 < 0.6.3 is vulnerable; pulled in transitively via google-auth / rsa / pyasn1-modules
    "pyasn1>=0.6.3",
    "attrs>=23.1.0",
    "cattrs>=23.1.0",
]
python-install-mirror = "http://maven.datav.com/repository/static/indygreg/python-build-standalone/"
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
trusted-host = "mirrors.aliyun.com"
default = true

[tool.ruff]
line-length = 200
target-version = "py312"
# 仅排除根目录的 server/、internal/（停滞的并行实现）；
# 用 dir/** 形式锚定仓库根，避免误伤 admin/server、mcp/server 等活代码
extend-exclude = ["server/**", "internal/**", "core/svr/discord_svr.py", "temp/**", "tmp/**"]
# pre-commit / 钩子显式传文件路径时也强制应用排除规则
force-exclude = true

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",               # pyflakes
    "W",               # pycodestyle warnings
    "I",               # isort
    "UP",              # pyupgrade（py3.12 语法现代化）
    "B",               # flake8-bugbear
    "C4",              # flake8-comprehensions
    "RUF",             # ruff 专有规则
]
ignore = [
    # ---- 永久忽略（代码库惯用法）----
    "RUF001", "RUF002", "RUF003",  # 中英混排全角标点（1w+ 处，不视为问题）
    "B008",    # FastAPI Depends()/Query() 作参数默认值的惯用法
    "E712",    # SQLAlchemy 过滤表达式需要 == True/False
    "E731",    # lambda 赋值
    "E741",    # 单字符变量名 l/O/I
    # ---- 燃尽清单（按包清理后逐条移出，禁止新增违规）----
    "E402",    # 模块级 import 不在顶部（init_root_logger 先行模式）
    "E722",    # bare except
    "B005",    # 多字符 strip（个别应改 removesuffix/removeprefix，清理时处理）
    "B006",    # 可变默认参数
    "B007",    # 循环变量未使用
    "B023",    # 闭包捕获循环变量
    "B024",    # 抽象基类无抽象方法
    "B027",    # 抽象类中的空方法未标 @abstractmethod
    "B904",    # except 内 raise 未带 from
    "B905",    # zip 未显式 strict=
    "F403",    # import *
    "F841",    # 未使用的局部变量
    "UP031",   # printf 风格格式化
    "UP040",   # 类型别名未用 PEP 695 type 语法
    "UP042",   # str+Enum 未改 StrEnum（影响序列化行为，需逐个评估）
    "UP046",   # 泛型类未用 PEP 695 语法
    "UP047",   # 泛型函数未用 PEP 695 语法
    "RUF005",  # 列表拼接未用解包（对非 list 操作数有语义差异）
    "RUF006",  # asyncio.create_task 结果未保存（需逐处评估生命周期）
    "RUF012",  # 类属性可变默认值未标 ClassVar
    "RUF013",  # 隐式 Optional
    "RUF049",  # dataclass + Enum 组合
    "RUF059",  # 解包未使用变量
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]        # re-export 惯用法
"tests/**" = ["F811", "B017"]   # fixture 遮蔽、宽泛 pytest.raises
# TODO: sensitive_word 功能整体被注释禁用（service 层类在 sensitive_word_service.py 中
# 全部注释掉），路由文件里的 Service 引用因此未定义，端点调用必然 500。
# 恢复该功能或删除该路由文件后移除本条。
"api/apps/sensitive_word_app.py" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["api", "common", "core", "agent", "deepdoc", "workflow", "workflow_v2", "memory", "mcp", "admin", "configs"]

# ============================================================
# mypy —— 渐进式静态类型检查（棘轮策略）
#
# 起步集 = files 列表。某个包清理干净后：
#   1. 将其加入 files（纳入检查范围，CI 从此保绿）
#   2. 用 [[tool.mypy.overrides]] 按模块逐步提升严格度
#      （check_untyped_defs → disallow_untyped_defs）
# 新增/修改的代码必须写完整类型注解（见 AGENTS.md）。
# 禁止为换绿而扩 exclude 或降低严格度。
# ============================================================
[tool.mypy]
python_version = "3.12"
files = ["common", "api/utils", "scripts"]
exclude = [
    "^server/", "^internal/", "^tests/", "^docker/", "^temp/", "^tmp/",
    # 燃尽目标：SaaS 连接器与向量库后端存量类型问题较多（各约 60/30 个），
    # 按连接器逐个清理后从此列表移出，纳入检查范围。
    "^common/data_source/",
    "^common/doc_store/",
]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = false        # 第一阶段：只检查有注解的函数体
implicit_optional = true          # 存量隐式 Optional（x: str = None）较多，清理后移除本行
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false       # 检查范围稳定后翻转
show_error_codes = true
pretty = true

# 配置重构新增模块直接以严格姿态纳管（棘轮只进不退）
[[tool.mypy.overrides]]
module = ["common.app_config"]
check_untyped_defs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = ["tests"]

# 测试用例收集规则（与 pytest 默认一致，显式声明）
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

markers = [
    "integration: 需要外部服务（DB/Redis/MinIO/向量库），服务缺失时自动跳过",
    "slow: 长耗时测试，默认快速门禁不跑",
    "smoke: 端到端存活检查",
]

# async def test_* 无需显式 marker（pytest-asyncio 自动接管）
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# 运行参数（强制 marker 注册、精简 traceback、彩色输出；tests/manual 不收集）
addopts = [
    "--strict-markers",
    "--tb=short",
    "--color=yes",
    "--ignore=tests/manual",
]

# 屏蔽第三方库的弃用/用户告警噪音（beartype / pydantic / pkg_resources 等），
# 保持测试输出聚焦真正的失败。注意：pytest.warns(...) 不受此影响，仍可断言告警。
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::SyntaxWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["api", "common", "core", "agent", "deepdoc", "workflow", "workflow_v2", "memory"]
branch = true
omit = ["tests/*", "server/*", "internal/*", "docker/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 1
skip_empty = true
# 暂不设 fail_under —— 先积累基线数据，稳定后按基线设阈值棘轮
