# 配置文件用于定义各种服务的连接和认证信息，以确保应用程序能正确地与这些服务通信。
#
# ⚠ 凭据规范（2026-07 起强制）：
#   本文件已入 git，只允许出现【占位符】和【docker-compose-base 的本地开发默认值】。
#   真实凭据一律放以下两处（优先级：环境变量 > local > 本文件）：
#     1. configs/local.service_conf.yaml（gitignored，按顶层 section 整体替换——覆盖必须写全该 section 字段）
#     2. 环境变量 MULTIRAG_<SECTION>__<FIELD>（如 MULTIRAG_POSTGRESQL__PASSWORD）
multirag:
  # multirag服务的监听地址（0.0.0.0 供 docker 端口映射；本机开发可在 local 覆盖）
  host: 0.0.0.0
  # multirag服务的HTTP端口
  http_port: 8123
  # multirag服务的SECRET_KEY（会话签名密钥；生产部署必须在 local/env 覆盖为强随机值）
  secret_key: 'changeme-in-production'
  # 管理后台是否需要超级管理员权限 (true: 仅超级管理员, false: 所有激活用户)
  admin_require_superuser: false

multimodal_upload_storage:
  # 指定用于多模态文件上传的存储类型: minio, oss, s3, azure_spn, azure_sas
  type: "minio"
  # 指定存储桶名称，如果不填则使用对应存储类型的默认桶
  bucket: "multimodal-temp"

admin:
  host: 0.0.0.0
  http_port: 8130

postgresql:
  # 数据库的类型
  name: 'postgresql'
  # 数据库的名称
  dbname: 'postgres'
  # postgresql数据库的用户名（默认值与 docker/docker-compose-base.yml 配套，仅限本地开发）
  user: 'usr_ai'
  # postgresql数据库的密码
  password: '123456'
  # postgresql数据库的主机名
  host: '127.0.0.1'
  # postgresql数据库的端口
  port: 5432
  # postgresql的最大连接数
  max_connections: 100
  # postgresql的过期超时时间
  stale_timeout: 30

minio:
  # 默认值与 docker/docker-compose-base.yml 配套，仅限本地开发
  user: 'minioadmin'
  password: '12345678'
  host: '127.0.0.1:9000'
  region: ''
  bucket: ''
  prefix_path: ''
  workflow_bucket: 'multirag-workflow'
  # 可选: 设为 true 启用 HTTPS (SSL/TLS)，MinIO 客户端和健康检查均生效
  # secure: false
  # 可选: 设为 false 允许自签名证书（如开发环境）
  # verify: true

azure:
  auth_type: 'spn'
  account_url: 'account_url'
  client_id: 'client_id'
  secret: 'secret'
  tenant_id: 'tenant_id'
  container_name: 'container_name'
  cloud: '${AZURE_CLOUD:-public}'  # Azure cloud: 'public', 'china', 'government', or 'germany'

# The OSS object storage uses the MySQL configuration above by default. If you need to switch to another object storage service, please uncomment and configure the following parameters.
opendal:
  scheme: 'mysql'  # Storage type, such as s3, oss, azure, etc.
  config:
  oss_table: 'opendal_storage'

s3:
  access_key: 'access_key'
  secret_key: 'secret_key'
  region: 'region'
  endpoint_url: 'endpoint_url'
  bucket: 'bucket'
  prefix_path: 'prefix_path'
  signature_version: 'v4'
  addressing_style: 'path'

gcs:
  bucket: 'bridgtl-edm-d-bucket-multirag'

oss:
  access_key: 'access_key'
  secret_key: 'secret_key'
  endpoint_url: 'https://s3.oss-cn-hangzhou.aliyuncs.com'
  region: 'cn-hangzhou'
  bucket: 'bucket_name'
  prefix_path: 'prefix_path'
  signature_version: 's3'
  addressing_style: 'virtual'

milvus:
  # Milvus服务的主机地址
  hosts: 'http://127.0.0.1:19530'
  # Milvus服务的用户名
  username: 'root'
  # Milvus服务的密码（Milvus 出厂默认值，仅限本地开发）
  password: 'Milvus'
  db_name: ''
  token: ''
  timeout: null
  kwargs: {}

vastbase:
  host: '127.0.0.1'
  port: 5434
  database: 'your_database'
  user: 'your_user'
  password: 'changeme'
  max_connections: 20
  schema: public

es:
  # Elasticsearch服务的主机地址
  hosts: 'http://localhost:1200'
  # Elasticsearch服务的用户名
  username: 'elastic'
  # Elasticsearch服务的密码（与 docker compose 模板配套，仅限本地开发）
  password: 'infini_rag_flow'

os:
  hosts: 'http://localhost:1201'
  username: 'admin'
  password: 'infini_rag_flow_OS_01'

infinity:
  uri: 'infinity:23817'
  postgres_port: 5432
  db_name: 'default_db'

oceanbase:
  scheme: 'oceanbase' # set 'mysql' to create connection using mysql config
  config:
    db_name: 'test'
    user: 'root@multirag'
    password: 'changeme'
    host: 'localhost'
    port: 2881

seekdb:
  scheme: 'oceanbase' # SeekDB is the lite version of OceanBase
  config:
    db_name: 'multirag_doc'
    user: 'root'
    password: 'infini_rag_flow'
    host: 'seekdb'
    port: 2881

redis:
  db: 1
  username: ''
  password: ''
  host: '127.0.0.1:6379'

# datav 项目方提供的独立 Redis（用于读取 workflow inputPlugin persondataList 等数据）
# 真实地址与密码放 local.service_conf.yaml
datav_redis:
  host: '127.0.0.1:6379'
  db: 0
  username: ''
  password: ''

datav_persondata_crypto:
  aes_key_hex: '...'
  aes_iv_hex: '...'

task_executor:
  message_queue_type: 'redis'

observability:
  # OTel 自动埋点开关（FastAPI/SQLAlchemy/Redis/httpx 四件套，初始化单点在
  # common/observability.py，经 bootstrap 启用）。默认关闭零开销；
  # 本地排查时起 docker/docker-compose-observability.yml 的 Jaeger 后打开
  enabled: false
  # OTLP gRPC 导出端点（本地 Jaeger 默认口；有平台端点时在 local/env 覆盖）
  otlp_endpoint: 'http://localhost:4317'
  # 服务名；留空时取 OTEL_SERVICE_NAME 环境变量，再退回按入口进程推导
  # （multirag-server / multirag-task-executor）
  service_name: ''

user_default_llm:
  factory: 'ZHIPU-AI'
  api_key: 'changeme'
  base_url: ''
  default_models:
    chat_model:
      name: 'glm-4.5-airx'
      factory: 'ZHIPU-AI'
      api_key: 'changeme'
      base_url: ''
    embedding_model:
      api_key: 'changeme'
      base_url: 'http://127.0.0.1:6380'
    asr_model:
      model: 'whisper-large-v3' # alias of name
    rerank_model:
      name: 'BAAI/bge-reranker-v2-m3'
    image2text_model:
      name: 'glm-4.6v'

oauth:
  oauth2:
    display_name: "OAuth2"
    client_id: "your_client_id"
    client_secret: "your_client_secret"
    authorization_url: "https://your-oauth-provider.com/oauth/authorize"
    token_url: "https://your-oauth-provider.com/oauth/token"
    userinfo_url: "https://your-oauth-provider.com/oauth/userinfo"
    redirect_uri: "https://your-app.com/v1/user/oauth/callback/oauth2"
  oidc:
    display_name: "OIDC"
    client_id: "your_client_id"
    client_secret: "your_client_secret"
    issuer: "https://your-oauth-provider.com/oidc"
    scope: "openid email profile"
    redirect_uri: "https://your-app.com/v1/user/oauth/callback/oidc"
  github:
    type: "github"
    icon: "github"
    display_name: "Github"
    client_id: "your_client_id"
    client_secret: "your_client_secret"
    redirect_uri: "https://your-app.com/v1/user/oauth/callback/github"

authentication:
  client:
    # 客户端认证开关
    switch: false
    # HTTP应用的密钥
    http_app_key:
    # HTTP应用的密钥
    http_secret_key:
  site:
    # 站点认证开关
    switch: false
  # SSO-only mode: hide password login form
  disable_password_login: false

permission:
  # 权限检查开关
  switch: false
  # 是否启用组件权限检查
  component: false
  # 是否启用数据集权限检查
  dataset: false

smtp:
  mail_server: "smtp.example.com"
  mail_port: 465
  mail_use_ssl: true
  mail_use_tls: false
  mail_username: "your_email@example.com"
  mail_password: "your_smtp_auth_code"  # SMTP 授权码（不是登录密码），真实值放 local.service_conf.yaml
  mail_default_sender:
    - "MultiRAG" # display name
    - "your_email@example.com"
  mail_frontend_url: "http://127.0.0.1:5173"

tcadp_config:
  secret_id: 'tencent_secret_id'
  secret_key: 'tencent_secret_key'
  region: 'tencent_region'

script_scheduler:
  # 如果源码部署，则使用localhost，如果docker部署，则使用宿主机的ip
  host: localhost
  port: 8124

dcs_server:
  # 有些功能需要与中台服务通信
  protocol: http
  host: 127.0.0.1
  port: 8080
  # 调用语义层接口时，需要使用的认证信息（真实值放 local.service_conf.yaml）
  semantic_server:
    access_key: 'your_access_key'
    secret_key: 'changeme'
