authentication:
  client:
    # 客户端认证开关
    switch: false
    # HTTP应用的密钥
    http_app_key:
    # HTTP应用的密钥
    http_secret_key:
  site:
    # 站点认证开关
    switch: false
  # SSO-only mode: hide password login form
  disable_password_login: false

permission:
  # 权限检查开关
  switch: false
  # 是否启用组件权限检查
