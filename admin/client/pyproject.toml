[project]
name = "multirag-cli"
version = "0.9.9"
description = "Admin Service's client of [MultiRAG](http://122.112.170.159:8888/scdf/ai/multrag.git). The Admin Service provides user management and system monitoring. "
authors = [{ name = "Xiaolong Du", email = "du13013901711@163.com" }]
license = { text = "Apache License, Version 2.0" }
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "requests>=2.30.0,<3.0.0",
    "beartype>=0.20.0,<1.0.0",
    "pycryptodomex>=3.10.0",
    "lark>=1.1.0",
]

[dependency-groups]
test = [
    "pytest>=8.3.5",
    "requests>=2.32.3",
    "requests-toolbelt>=1.0.0",
]

[project.scripts]
multirag-cli = "multirag_cli:main"

[tool.setuptools]
py-modules = ["multirag_cli", "parser"]