title = "MultiRAG gitleaks 配置"

# 继承 gitleaks 默认规则集
[extend]
useDefault = true

# ---- 路径豁免 ----

[[allowlists]]
description = "gitignored 本地凭据覆盖文件（真实凭据的合法存放处；CI integration job 会动态生成同名文件）"
paths = ['''configs/local\.service_conf\.yaml''']

[[allowlists]]
description = "gitignored 本地产物：运行日志、字节码缓存、IDE 状态（dir 扫描时跳过；均不入库）"
paths = [
    '''^logs/''',
    '''__pycache__/''',
    '''^\.idea/''',
    '''^fastmcp\.txt$''',
]

[[allowlists]]
description = "上游 ragflow 出厂 RSA 密钥对（与上游 conf/ 逐字节一致、全球公开）。仅限本地开发；生产部署必须更换自有密钥对"
paths = [
    '''configs/private\.pem''',
    '''configs/public\.pem''',
]

# 版本号写成 v\d+ 而不是逐版本追加：语料每加一个版本就漏一批，v2 落地时就是这么红的
# （77 条全部来自未豁免的 v2/tokens）。放宽版本不降低安全性——豁免只作用于 jwt 这一条
# 规则，同目录下的私钥/API key 规则照常生效，而 test_eim_a1_sha256sums_* 逐文件校验
# SHA-256，任何内容漂移都会先在单元测试红。
[[allowlists]]
description = "EIM-A1 字节锁定的合成 JWT 契约向量（只豁免 jwt 规则；目录校验和与测试会检测任何内容漂移）"
targetRules = ["jwt"]
paths = ['''^tests/fixtures/eim_a1/v\d+/tokens/[^/]+\.jwt$''']

# ---- 内容豁免（占位符/测试假值） ----

[[allowlists]]
description = "文档示例与测试假值：curl 示例的 YOUR_TOKEN 占位符、crypto_utils 文档示例的 test_key"
regexes = [
    '''YOUR_TOKEN''',
    '''YOUR_API_KEY''',
    '''test_key_123456''',
]
