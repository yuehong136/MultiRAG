title = "MultiRAG gitleaks 配置"

# 继承 gitleaks 默认规则集
[extend]
useDefault = true

# ---- 路径豁免 ----

[[allowlists]]
description = "gitignored 本地凭据覆盖文件（真实凭据的合法存放处；CI integration job 会动态生成同名文件）"
paths = ['''configs/local\.service_conf\.yaml''']

[[allowlists]]
description = "gitignored 本地产物：运行日志、字节码缓存、IDE 状态（dir 扫描时跳过；均不入库）"
paths = [
    '''^logs/''',
    '''__pycache__/''',
    '''^\.idea/''',
    '''^fastmcp\.txt$''',
]

[[allowlists]]
description = "上游 ragflow 出厂 RSA 密钥对（与上游 conf/ 逐字节一致、全球公开）。仅限本地开发；生产部署必须更换自有密钥对"
paths = [
    '''configs/private\.pem''',
    '''configs/public\.pem''',
]

# 版本号写成 v\d+ 而不是逐版本追加：语料每加一个版本就漏一批，v2 落地时就是这么红的
# （77 条全部来自未豁免的 v2/tokens）。放宽版本不降低安全性——豁免只作用于 jwt 这一条
# 规则，同目录下的私钥/API key 规则照常生效，而 test_eim_a1_sha256sums_* 逐文件校验
# SHA-256，任何内容漂移都会先在单元测试红。
[[allowlists]]
description = "EIM-A1 字节锁定的合成 JWT 契约向量（只豁免 jwt 规则；目录校验和与测试会检测任何内容漂移）"
targetRules = ["jwt"]
paths = ['''^tests/fixtures/eim_a1/v\d+/tokens/[^/]+\.jwt$''']

# 该文件断言的是"脚本生成的私钥文件以 PEM 头开头"以及"脚本不得把私钥打进 stdout"——
# 命中的就是断言里那串 PEM 头字面量，文件内不含任何密钥材料，密钥由用例在 tmp_path
# 里现生成现销毁。只豁免 private-key 这一条规则，其余规则在该文件上照常生效。
[[allowlists]]
description = "P3 签名密钥脚本测试里的 PEM 头字面量（断言用，非密钥材料）"
targetRules = ["private-key"]
paths = ['''^tests/unit/test_mcp_signing_key_scripts\.py$''']

# ---- 内容豁免（占位符/测试假值） ----

[[allowlists]]
description = "文档示例与测试假值：curl 示例的 YOUR_TOKEN 占位符、crypto_utils 文档示例的 test_key"
regexes = [
    '''YOUR_TOKEN''',
    '''YOUR_API_KEY''',
    '''test_key_123456''',
]

# 仅排除这些文件内已核对的固定假值；同一路径上的其他密钥仍须报警。
[[allowlists]]
description = "Azure 受控 transport 的合成 base64 假值和加密包装器的固定测试 key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
    '''^tests/integration/test_azure_(storage_protocol|blob_source_sync)\.py$''',
    '''^tests/integration/test_runtime_cleanup_storage_protocol\.py$''',
    '''^tests/unit/test_azure_blob_(worker_lifecycle|source_connector)\.py$''',
    '''^tests/support/search_connector_web_consumer\.ts$''',
]
regexTarget = "secret"
regexes = [
    '''^0123456789abcdef0123456789abcdef$''',
    '''^Y29udHJvbGxlZC1rZXk=$''',
    '''^Zml4dHVyZS1vbmx5LWtleQ==$''',
]

[[allowlists]]
description = "固定质量模型的三个公开 tokenizer 文件 SHA-256（非认证材料）"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^scripts/provision_eval_assets\.py$''']
regexTarget = "secret"
regexes = [
    '''^48cea5d44424912a6fd1ea647bf4fe50b55ab8b1e5879c3275f80e339e8fae26$''',
    '''^e6f3b96db926a37d4039995fbf5ad17de158dfb8f6343d607e4dbaad18d75f5a$''',
    '''^b6d346be366a7d1d48332dbc9fdf3bf8960b5d879522b7799ddba59e76237ee3$''',
]
